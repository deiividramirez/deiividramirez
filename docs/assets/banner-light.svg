    <!-- Restrained Subtitle -->
    <text x="0" y="124">
      <tspan fill="#B84326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18.5" font-weight="600">Neuromorphic Applications Engineer</tspan>
      <tspan dx="8" fill="#525252" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19.5">— Computer Vision &amp; Robotics</tspan>
    </text>

    <!-- Factual Engineering Summary -->
    <text x="0" y="164" fill="#3D3D3D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.2" font-weight="400">LLMs, VLAs &amp; embeddings on Intel Loihi · Real-time C/C++ &amp; GStreamer edge systems · Aerial robotics</text>

    <!-- Sharp Hairline Metadata Tags -->
    <g transform="translate(0, 196)">
      <rect x="0" y="0" width="152" height="28" rx="2" fill="#FAF9F6" stroke="#E2E2E2"/>
      <text x="76" y="18" text-anchor="middle" fill="#1A1A1A" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="500">01. INTEL LOIHI</text>

      <rect x="162" y="0" width="166" height="28" rx="2" fill="#FAF9F6" stroke="#E2E2E2"/>
      <text x="245" y="18" text-anchor="middle" fill="#1A1A1A" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="500">02. C++ / GSTREAMER</text>

      <rect x="338" y="0" width="168" height="28" rx="2" fill="#FAF9F6" stroke="#E2E2E2"/>
      <text x="422" y="18" text-anchor="middle" fill="#1A1A1A" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="500">03. VISION CONTROL</text>

      <rect x="516" y="0" width="136" height="28" rx="2" fill="#B84326"/>
      <text x="584" y="18" text-anchor="middle" fill="#FAF9F6" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600">leoram.dev ↗</text>
    </g>
