<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" fill="none">
  <!-- Warm Off-White Matte Architectural Canvas -->
  <rect width="1200" height="320" rx="3" fill="#FAF9F6"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="2.5" stroke="#E2E2E2" stroke-width="1"/>

  <!-- Single Restrained Burnt Sienna Accent Rule -->
  <rect x="48" y="0" width="96" height="3" fill="#B84326"/>

  <!-- Vertical Architectural Divider -->
  <line x1="766" y1="36" x2="766" y2="284" stroke="#E2E2E2" stroke-width="1"/>

  <!-- Right Side: Monochrome + Burnt Sienna Technical Diagram -->
  <g transform="translate(788, 36)">
    <rect x="0" y="0" width="364" height="248" rx="2" fill="#F3F1EC" stroke="#E2E2E2" stroke-width="1"/>
    <line x1="0" y1="32" x2="364" y2="32" stroke="#E2E2E2" stroke-width="1"/>
    <text x="16" y="20" fill="#6B6B6B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" letter-spacing="0.8">FIG. 01 — EVENT SPIKE &amp; BEARING LATTICE</text>

    <!-- Synaptic / Bearing Hairlines -->
    <g stroke="#1A1A1A" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="3 3">
      <line x1="58" y1="86" x2="162" y2="70"/>
      <line x1="58" y1="86" x2="118" y2="156"/>
      <line x1="162" y1="70" x2="274" y2="96"/>
      <line x1="162" y1="70" x2="206" y2="154"/>
      <line x1="118" y1="156" x2="206" y2="154"/>
      <line x1="206" y1="154" x2="308" y2="176"/>
      <line x1="274" y1="96" x2="308" y2="176"/>
      <line x1="118" y1="156" x2="68" y2="194"/>
    </g>

    <!-- Active Propagation Paths (Charcoal + Burnt Sienna Only) -->
    <path d="M58 86 L162 70 L206 154 L308 176" stroke="#1A1A1A" stroke-width="1.8"/>
    <path d="M118 156 L206 154 L274 96" stroke="#B84326" stroke-width="2"/>

    <!-- Bottom Spike Train Raster -->
    <g transform="translate(18, 210)">
      <line x1="0" y1="14" x2="148" y2="14" stroke="#E2E2E2" stroke-width="1"/>
      <line x1="10" y1="4" x2="10" y2="22" stroke="#1A1A1A" stroke-width="1.8"/>
      <line x1="24" y1="7" x2="24" y2="19" stroke="#1A1A1A" stroke-width="1.8"/>
      <line x1="46" y1="2" x2="46" y2="24" stroke="#B84326" stroke-width="2"/>
      <line x1="62" y1="7" x2="62" y2="19" stroke="#1A1A1A" stroke-width="1.8"/>
      <line x1="86" y1="3" x2="86" y2="23" stroke="#B84326" stroke-width="2"/>
      <line x1="104" y1="6" x2="104" y2="20" stroke="#1A1A1A" stroke-width="1.8"/>
      <line x1="122" y1="4" x2="122" y2="22" stroke="#B84326" stroke-width="2"/>
    </g>
    <text x="218" y="228" fill="#6B6B6B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" letter-spacing="0.6">SNN · VLA · Δt SPARSE</text>

    <!-- Nodes -->
    <circle cx="58" cy="86" r="4" fill="#1A1A1A"/>
    <circle cx="162" cy="70" r="4.5" fill="#1A1A1A"/>
    <circle cx="118" cy="156" r="4.5" fill="#B84326"/>
    <circle cx="206" cy="154" r="9" stroke="#B84326" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="206" cy="154" r="5" fill="#B84326"/>
    <circle cx="274" cy="96" r="4.5" fill="#B84326"/>
    <circle cx="308" cy="176" r="4.5" fill="#1A1A1A"/>
    <circle cx="68" cy="194" r="3" fill="#8C8C8C"/>
  </g>

  <!-- Left Side: Editorial Serif & Technical Monospace -->
  <g transform="translate(48, 54)">
    <text x="0" y="14" fill="#6B6B6B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" letter-spacing="1.0">INTEL · GUADALAJARA, MEXICO — M.SC. CS (CIMAT) · MATHEMATICIAN</text>

    <!-- Editorial Serif Name -->
